name: Watch Kuzelka terminy

on:
  schedule:
    # GitHub may delay scheduled workflows. The job itself watches continuously
    # for almost six hours, so it does not depend on precise cron delivery.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kuzelka-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          KUZELKA_USERNAME: ${{ secrets.KUZELKA_USERNAME }}
          KUZELKA_PASSWORD: ${{ secrets.KUZELKA_PASSWORD }}
          KUZELKA_TARGET_MONTH: ${{ vars.KUZELKA_TARGET_MONTH || 'september 2026' }}
          KUZELKA_POLL_INTERVAL_SECONDS: ${{ vars.KUZELKA_POLL_INTERVAL_SECONDS || '30' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python3 watcher.py

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "kuzelka-watcher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update known terminy state [skip ci]"
            git push
          fi
